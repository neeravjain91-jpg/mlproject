<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Exam Performance Prediction</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .login {
            max-width: 850px;
            margin: 50px auto;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .card-header {
            background-color: #0d6efd;
            color: white;
            text-align: center;
            padding: 25px;
            border-radius: 15px 15px 0 0;
        }

        .card-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .card-header p {
            margin: 8px 0 0;
        }

        .card-body {
            padding: 35px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            height: 48px;
            border-radius: 8px;
        }

        .form-control:focus,
        .form-select:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .predict-button {
            width: 100%;
            height: 50px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
        }

        .prediction-result {
            margin-top: 25px;
            padding: 20px;
            background-color: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 8px;
            text-align: center;
        }

        .prediction-result h2 {
            margin: 0;
            color: #198754;
        }

        .required {
            color: red;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }
    </style>

</head>


<body>

    <div class="login">

        <div class="card">

            <!-- Page Header -->
            <div class="card-header">

                <h1>
                    Student Exam Performance Indicator
                </h1>

                <p>
                    Enter student information to predict the Maths Score
                </p>

            </div>


            <div class="card-body">

                <!-- IMPORTANT:
                     This route matches your existing app.py
                -->
                <form
                    action="{{ url_for('predict_datapoint') }}"
                    method="post"
                >


                    <!-- Gender -->
                    <div class="mb-4">

                        <label class="form-label">
                            Gender
                            <span class="required">*</span>
                        </label>

                        <select
                            class="form-select"
                            name="gender"
                            required
                        >

                            <option
                                value=""
                                selected
                                disabled
                            >
                                Select your Gender
                            </option>

                            <option value="male">
                                Male
                            </option>

                            <option value="female">
                                Female
                            </option>

                        </select>

                    </div>


                    <!-- Race / Ethnicity -->
                    <div class="mb-4">

                        <label class="form-label">
                            Race or Ethnicity
                            <span class="required">*</span>
                        </label>

                        <!-- IMPORTANT:
                             app.py expects race_ethnicity
                        -->
                        <select
                            class="form-select"
                            name="race_ethnicity"
                            required
                        >

                            <option
                                value=""
                                selected
                                disabled
                            >
                                Select Ethnicity
                            </option>

                            <option value="group A">
                                Group A
                            </option>

                            <option value="group B">
                                Group B
                            </option>

                            <option value="group C">
                                Group C
                            </option>

                            <option value="group D">
                                Group D
                            </option>

                            <option value="group E">
                                Group E
                            </option>

                        </select>

                    </div>


                    <!-- Parental Level of Education -->
                    <div class="mb-4">

                        <label class="form-label">
                            Parental Level of Education
                            <span class="required">*</span>
                        </label>

                        <select
                            class="form-select"
                            name="parental_level_of_education"
                            required
                        >

                            <option
                                value=""
                                selected
                                disabled
                            >
                                Select Parental Education
                            </option>

                            <option value="associate's degree">
                                Associate's Degree
                            </option>

                            <option value="bachelor's degree">
                                Bachelor's Degree
                            </option>

                            <option value="high school">
                                High School
                            </option>

                            <option value="master's degree">
                                Master's Degree
                            </option>

                            <option value="some college">
                                Some College
                            </option>

                            <option value="some high school">
                                Some High School
                            </option>

                        </select>

                    </div>


                    <!-- Lunch -->
                    <div class="mb-4">

                        <label class="form-label">
                            Lunch
                            <span class="required">*</span>
                        </label>

                        <select
                            class="form-select"
                            name="lunch"
                            required
                        >

                            <option
                                value=""
                                selected
                                disabled
                            >
                                Select Lunch Type
                            </option>

                            <option value="free/reduced">
                                Free / Reduced
                            </option>

                            <option value="standard">
                                Standard
                            </option>

                        </select>

                    </div>


                    <!-- Test Preparation Course -->
                    <div class="mb-4">

                        <label class="form-label">
                            Test Preparation Course
                            <span class="required">*</span>
                        </label>

                        <select
                            class="form-select"
                            name="test_preparation_course"
                            required
                        >

                            <option
                                value=""
                                selected
                                disabled
                            >
                                Select Test Preparation Course
                            </option>

                            <option value="none">
                                None
                            </option>

                            <option value="completed">
                                Completed
                            </option>

                        </select>

                    </div>


                    <!-- Reading Score -->
                    <div class="mb-4">

                        <label class="form-label">
                            Reading Score out of 100
                            <span class="required">*</span>
                        </label>

                        <input
                            class="form-control"
                            type="number"
                            name="reading_score"
                            placeholder="Enter your Reading Score"
                            min="0"
                            max="100"
                            required
                        >

                    </div>


                    <!-- Writing Score -->
                    <div class="mb-4">

                        <label class="form-label">
                            Writing Score out of 100
                            <span class="required">*</span>
                        </label>

                        <input
                            class="form-control"
                            type="number"
                            name="writing_score"
                            placeholder="Enter your Writing Score"
                            min="0"
                            max="100"
                            required
                        >

                    </div>


                    <!-- Submit Button -->
                    <div class="mb-3">

                        <input
                            class="btn btn-primary predict-button"
                            type="submit"
                            value="Predict your Score"
                        >

                    </div>

                </form>


                <!-- Prediction Result -->
                {% if results %}

                <div class="prediction-result">

                    <h2>
                        The predicted Maths Score is:
                        {{ results }}
                    </h2>

                </div>

                {% endif %}


            </div>

        </div>


        <footer>
            Student Exam Performance Prediction
        </footer>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
